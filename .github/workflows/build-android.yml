name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer cython python-for-android

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Pre-create libs directory in python-for-android bootstraps
        run: |
          P4A_PATH=$(python -c "import pythonforandroid; print(pythonforandroid.__path__[0])")
          echo "python-for-android path: $P4A_PATH"
          mkdir -p "$P4A_PATH/bootstraps/webview/build/src/main/libs"
          mkdir -p "$P4A_PATH/bootstraps/common/build/src/main/libs"
          python -c "
          content = open('buildozer.spec').read()
          new_content = content.replace('[buildozer]', 'android.p4a_dir = ' + '$P4A_PATH' + '\n\n[buildozer]')
          open('buildozer.spec', 'w').write(new_content)
          "

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          yes | buildozer android debug 2>&1 | tee build.log


      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mastery-debug-apk
          path: bin/*.apk
          retention-days: 30
