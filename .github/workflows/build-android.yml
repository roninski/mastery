name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Clone and patch python-for-android bootstraps
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git
          mkdir -p python-for-android/pythonforandroid/bootstraps/webview/build/src/main/libs
          mkdir -p python-for-android/pythonforandroid/bootstraps/common/build/src/main/libs
          python -c "
          import os
          content = open('buildozer.spec').read()
          p4a_dir = os.path.abspath('python-for-android')
          new_content = content.replace('[buildozer]', 'p4a.source_dir = ' + p4a_dir + '\n\n[buildozer]')
          open('buildozer.spec', 'w').write(new_content)
          "

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          yes | buildozer android debug 2>&1 | tee build.log


      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mastery-debug-apk
          path: bin/*.apk
          retention-days: 30
