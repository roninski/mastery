name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          # Pass 1: run buildozer to generate the Gradle project and compile Python.
          # p4a references libs/pywebview-android.jar in build.gradle via android.add_jars
          # but does not copy it into the dist before running Gradle, so the internal
          # Gradle run fails. That failure is caught here; everything else is set up.
          yes | buildozer android debug 2>&1 | tee build.log || true

          # The Gradle project is generated at a path that is fully determined by
          # package.name and android.archs in buildozer.spec.
          DIST_DIR=".buildozer/android/platform/build-arm64-v8a/dists/mastery"
          if [ ! -d "$DIST_DIR" ]; then
            echo "ERROR: Gradle project not found at $DIST_DIR — first pass failed to generate it"
            exit 1
          fi

          # Place the JAR where build.gradle expects it and disable Jetifier so the
          # plain JAR is packaged without an AndroidX migration transform.
          mkdir -p "$DIST_DIR/src/main/libs"
          cp libs/pywebview-android.jar "$DIST_DIR/src/main/libs/"
          if grep -q "android.enableJetifier" "$DIST_DIR/gradle.properties"; then
            sed -i 's/android\.enableJetifier=true/android.enableJetifier=false/' "$DIST_DIR/gradle.properties"
          else
            echo "android.enableJetifier=false" >> "$DIST_DIR/gradle.properties"
          fi

          # Pass 2: assemble the APK now that the project is complete.
          "$DIST_DIR/gradlew" -p "$DIST_DIR" assembleDebug --no-daemon \
            2>&1 | tee -a build.log

          # Collect the APK.
          mkdir -p bin
          find "$DIST_DIR/build/outputs/apk/debug" -name "*.apk" -exec cp {} bin/ \;

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mastery-debug-apk
          path: bin/*.apk
          retention-days: 30
